name: Deploy ONEORA Web App & OTA Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-website:
    name: Build & Publish ONEORA (GitHub Pages + OTA Source)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Full ONEORA Bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
          rm -rf _site
          mkdir -p _site
          cp -r dist/* _site/
          rm -rf _site/assets/aistudio
          touch _site/.nojekyll
          ls -lh _site
          ls -lh _site/vendor

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
