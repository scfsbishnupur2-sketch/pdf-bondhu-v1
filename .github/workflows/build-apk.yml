name: Build PDF Bondhu 2.0 (APK & Play Store AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Optional custom URL (leave empty to use built-in bundled PDF Bondhu offline engine)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 35
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0"
          else
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate release signing keystore
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -keystore android/keystore/pdfbondhu-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias pdfbondhu \
            -storepass pdfbondhu123 \
            -keypass pdfbondhu123 \
            -dname "CN=PDF Bondhu, OU=Mobile, O=Nayak, L=Kolkata, ST=WB, C=IN"

      - name: Bundle Web App & All Modules into Android Assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/index.html
          for f in public/*.js public/*.json public/*.svg public/*.png public/*.ico; do
            [ -f "$f" ] && cp "$f" android/app/src/main/assets/www/
          done
          ls -lh android/app/src/main/assets/www

      - name: Build Signed Release APK & Play Store AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/pdfbondhu-release.jks
          KEYSTORE_PASSWORD: pdfbondhu123
          KEY_ALIAS: pdfbondhu
          KEY_PASSWORD: pdfbondhu123
        run: |
          APP_URL_INPUT="${{ github.event.inputs.app_url }}"
          if [ -n "$APP_URL_INPUT" ]; then
            gradle assembleRelease bundleRelease -PAPP_URL="$APP_URL_INPUT" -PGITHUB_REPO="${{ github.repository }}" --no-daemon
          else
            gradle assembleRelease bundleRelease -PGITHUB_REPO="${{ github.repository }}" --no-daemon
          fi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/PDF-Bondhu-2.0.apk
          cp android/app/build/outputs/bundle/release/app-release.aab apk-output/PDF-Bondhu-2.0.aab
          ls -lh apk-output

      - name: Upload APK & Play Store AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Bondhu-2.0-Release
          path: apk-output/
          retention-days: 90

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0-latest
          name: PDF Bondhu 2.0 (APK & Play Store AAB)
          body: |
            **PDF Bondhu 2.0 — One App. Everyday Solutions.**
            - Download `PDF-Bondhu-2.0.apk` to install directly on Android phones.
            - Upload `PDF-Bondhu-2.0.aab` directly to Google Play Console for Play Store release.
          files: |
            apk-output/PDF-Bondhu-2.0.apk
            apk-output/PDF-Bondhu-2.0.aab
          make_latest: true
