name: Build ONEORA 3.0 (APK & Play Store AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Optional custom URL (leave empty to use built-in bundled ONEORA offline engine)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 35
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0"
          else
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Release Signing Keystore (Fixed Secret or Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          KEYSTORE_FILE="${{ github.workspace }}/android/keystore/oneora-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using permanent signing keystore from GitHub Secrets (seamless upgrades enabled)."
            printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${SECRET_STORE_PASS}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASS}" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not configured. Generating temporary test keystore. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets for permanent Play Store & in-place APK upgrades."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias pdfbondhu \
              -storepass pdfbondhu123 \
              -keypass pdfbondhu123 \
              -dname "CN=ONEORA, OU=Mobile, O=Nayak, L=Kolkata, ST=WB, C=IN"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=pdfbondhu123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=pdfbondhu" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=pdfbondhu123" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build ONEORA Web Bundle & Offline Libraries
        run: |
          npm ci
          npm run build
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          ls -lh android/app/src/main/assets/www
          ls -lh android/app/src/main/assets/www/vendor

      - name: Build Signed Release APK & Play Store AAB
        working-directory: android
        run: |
          APP_URL_INPUT="${{ github.event.inputs.app_url }}"
          if [ -n "$APP_URL_INPUT" ]; then
            gradle assembleRelease bundleRelease -PAPP_URL="$APP_URL_INPUT" -PGITHUB_REPO="${{ github.repository }}" --no-daemon
          else
            gradle assembleRelease bundleRelease -PGITHUB_REPO="${{ github.repository }}" --no-daemon
          fi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/ONEORA-3.0.apk
          cp android/app/build/outputs/bundle/release/app-release.aab apk-output/ONEORA-3.0.aab
          ls -lh apk-output

      - name: Upload APK & Play Store AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ONEORA-3.0-Release
          path: apk-output/
          retention-days: 90

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3.0-latest
          name: ONEORA 3.0 (APK & Play Store AAB)
          body: |
            **ONEORA 3.0 — One App, More Possibilities**
            - Download `ONEORA-3.0.apk` to install directly on Android phones.
            - Future web/UI updates arrive automatically inside the app via OTA (no reinstall needed).
            - Upload `ONEORA-3.0.aab` to Google Play Console for Play Store release.
          files: |
            apk-output/ONEORA-3.0.apk
            apk-output/ONEORA-3.0.aab
          make_latest: true
