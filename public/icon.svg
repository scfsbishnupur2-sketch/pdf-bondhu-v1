<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="52%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Vibrant Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <path d="M0 116C0 52 52 0 116 0h280c64 0 116 52 116 116v84C380 280 180 160 0 268V116z" fill="url(#sheenGrad)"/>

  <!-- Precision Scanner Frame Corners -->
  <g stroke="#67e8f9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M84 148V102a18 18 0 0 1 18-18h46"/>
    <path d="M364 84h46a18 18 0 0 1 18 18v46"/>
    <path d="M428 364v46a18 18 0 0 1-18 18h-46"/>
    <path d="M148 428h-46a18 18 0 0 1-18-18v-46"/>
  </g>

  <!-- Floating Crisp Document Card -->
  <g filter="url(#cardShadow)">
    <path d="M158 112h136l82 82v198c0 17.7-14.3 32-32 32H158c-17.7 0-32-14.3-32-32V144c0-17.7 14.3-32 32-32z" fill="#ffffff"/>
    <!-- Golden Folded Corner -->
    <path d="M294 112v56c0 14.4 11.6 26 26 26h56l-82-82z" fill="url(#foldGrad)"/>
  </g>

  <!-- Vibrant PDF Ribbon Badge -->
  <rect x="114" y="218" width="218" height="78" rx="22" fill="url(#ribbonGrad)"/>
  <text x="223" y="271" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="4">PDF</text>

  <!-- Clean Document Content Lines -->
  <rect x="166" y="324" width="166" height="16" rx="8" fill="#6366f1" opacity="0.85"/>
  <rect x="166" y="356" width="118" height="14" rx="7" fill="#94a3b8" opacity="0.75"/>

  <!-- Radiant Golden Sparkle Star -->
  <path d="M392 146l8 22 22 8-22 8-8 22-8-22-22-8 22-8z" fill="#fde047"/>
</svg>
